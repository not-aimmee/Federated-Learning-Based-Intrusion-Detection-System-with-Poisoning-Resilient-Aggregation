[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sklearnexample"
version = "1.0.0"
description = "Federated intrusion detection (CICIDS2017) with poisoning-resilient aggregation, built on Flower and scikit-learn"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.36.0",
    "scikit-learn>=1.6.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fids"
fab-format-version = 1
flwr-version-target = "1.37.0"

[tool.flwr.app.components]
serverapp = "sklearnexample.server_app:app"
clientapp = "sklearnexample.client_app:app"

# Every key below can be overridden:  flwr run . --run-config "aggregation='krum' malicious-fraction=0.2"
[tool.flwr.app.config]
num-server-rounds = 20
fraction-train = 1.0
fraction-evaluate = 0.0
local-epochs = 1
learning-rate = 0.01
partition-alpha = 0.0
seed = 42
attack = "none"
malicious-fraction = 0.0
poison-scale = 3.0
aggregation = "fedavg"
defense-fraction = -1.0
trim-ratio = -1.0
run-name = "default"
project-dir = ""
data-dir = ""
results-dir = ""